<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Exercício 03 — Contador de cliques</title>
<style>
body{font-family:Arial, sans-serif;background:#f4f4f4;padding:40px;color:#333;text-align:center}
main{background:#fff;max-width:500px;margin:auto;padding:30px 35px;border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
button{padding:10px 18px;border:none;border-radius:6px;background:#2d6cdf;color:#fff;cursor:pointer;margin-top:10px}
button:hover{background:#1f4fb0}
#cliques{font-size:18px;margin-top:15px}
</style>
</head>
<body>
<main>
    <h1>Contador de Cliques</h1>
    <button id="btnClique">+ Clique aqui</button>
    <p id="cliques">Cliques: 0</p>
</main>

<script>
    const botao = document.querySelector("#btnClique");
    const cliquesEl = document.querySelector("#cliques");

    let contador = 0;

    botao.addEventListener("click", function() {
        contador = contador + 1;
        cliquesEl.textContent = `Cliques: ${contador}`;
    });
</script>
</body>
</html>
