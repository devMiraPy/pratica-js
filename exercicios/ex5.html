<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Exercício 05 — Calculadora simples</title>
<style>
body{font-family:Arial, sans-serif;background:#f4f4f4;padding:40px;color:#333}
main{background:#fff;max-width:500px;margin:auto;padding:30px 35px;border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
h1{font-size:20px}
input{padding:9px;margin:6px 0;width:100%;box-sizing:border-box;border:1px solid #ccc;border-radius:6px;font-size:14px}
button{padding:10px 18px;border:none;border-radius:6px;background:#2d6cdf;color:#fff;cursor:pointer;margin-top:10px}
button:hover{background:#1f4fb0}
#total{margin-top:15px;font-size:18px;font-weight:bold;color:#1e8449}
</style>
</head>
<body>
<main>
    <h1>Calculadora da Loja</h1>

    <input type="text" id="produto" placeholder="Produto">
    <input type="number" id="quantidade" placeholder="Quantidade">
    <input type="number" id="preco" placeholder="Preço unitário (R$)">

    <button id="btnCalcular">Calcular</button>

    <p id="total"></p>
</main>

<script>
    const produto = document.querySelector("#produto");
    const quantidade = document.querySelector("#quantidade");
    const preco = document.querySelector("#preco");
    const botao = document.querySelector("#btnCalcular");
    const total = document.querySelector("#total");

    botao.addEventListener("click", function() {
        const qtd = Number(quantidade.value);
        const valorUnitario = Number(preco.value);

        const totalCompra = qtd * valorUnitario;

        total.textContent = `${produto.value || "Produto"} — Total: R$ ${totalCompra.toFixed(2)}`;
    });
</script>
</body>
</html>
