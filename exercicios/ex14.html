<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Exercício 14 — Dashboard de vendas</title>
<style>
body{font-family:Arial, sans-serif;background:#f4f4f4;padding:40px;color:#333}
main{background:#fff;max-width:650px;margin:auto;padding:30px 35px;border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
h1{font-size:20px}
h2{font-size:16px;color:#555;margin-top:24px}
input{padding:9px;margin:6px 0;width:100%;box-sizing:border-box;border:1px solid #ccc;border-radius:6px;font-size:14px}
button{padding:10px 18px;border:none;border-radius:6px;background:#2d6cdf;color:#fff;cursor:pointer;margin-top:10px}
button:hover{background:#1f4fb0}
table{width:100%;border-collapse:collapse;margin-top:15px;font-size:14px}
th,td{border:1px solid #ddd;padding:8px;text-align:left}
th{background:#f0f0f0}
.contadores{display:flex;gap:20px;margin-top:18px;font-size:14px;flex-wrap:wrap}
.contadores span{background:#f0f6ff;padding:10px 14px;border-radius:8px;font-weight:bold}
</style>
</head>
<body>
<main>
    <h1>Dashboard de Vendas</h1>

    <input type="text" id="produto" placeholder="Produto">
    <input type="number" id="quantidade" placeholder="Quantidade">
    <input type="number" id="valorUnitario" placeholder="Valor unitário (R$)">

    <button id="btnAdicionar">Adicionar venda</button>

    <h2>Pesquisar produto</h2>
    <input type="text" id="pesquisa" placeholder="Digite para filtrar...">

    <h2>Vendas registradas</h2>
    <table>
        <thead>
            <tr>
                <th>Produto</th>
                <th>Quantidade</th>
                <th>Valor unitário</th>
                <th>Total</th>
            </tr>
        </thead>
        <tbody id="tabelaVendas"></tbody>
    </table>

    <div class="contadores">
        <span id="faturamento">Faturamento: R$ 0.00</span>
        <span id="itens">Itens vendidos: 0</span>
        <span id="vendasRealizadas">Vendas realizadas: 0</span>
    </div>
</main>

<script>
    const produtoInput = document.querySelector("#produto");
    const quantidadeInput = document.querySelector("#quantidade");
    const valorInput = document.querySelector("#valorUnitario");
    const botao = document.querySelector("#btnAdicionar");
    const tabela = document.querySelector("#tabelaVendas");
    const pesquisa = document.querySelector("#pesquisa");

    const faturamentoEl = document.querySelector("#faturamento");
    const itensEl = document.querySelector("#itens");
    const vendasEl = document.querySelector("#vendasRealizadas");

    let vendas = [];

    botao.addEventListener("click", function() {
        const produto = produtoInput.value;
        const quantidade = Number(quantidadeInput.value);
        const valorUnitario = Number(valorInput.value);

        if (produto === "" || quantidade <= 0 || valorUnitario <= 0) {
            return;
        }

        const totalVenda = quantidade * valorUnitario;

        vendas.push({ produto, quantidade, valorUnitario, totalVenda });

        produtoInput.value = "";
        quantidadeInput.value = "";
        valorInput.value = "";

        renderizarTabela(vendas);
        atualizarContadores();
    });

    pesquisa.addEventListener("input", function() {
        const termo = pesquisa.value.toLowerCase();
        const filtradas = vendas.filter(function(venda) {
            return venda.produto.toLowerCase().includes(termo);
        });
        renderizarTabela(filtradas);
    });

    function renderizarTabela(listaVendas) {
        tabela.innerHTML = "";

        listaVendas.forEach(function(venda) {
            const linha = document.createElement("tr");
            linha.innerHTML = `
                <td>${venda.produto}</td>
                <td>${venda.quantidade}</td>
                <td>R$ ${venda.valorUnitario.toFixed(2)}</td>
                <td>R$ ${venda.totalVenda.toFixed(2)}</td>
            `;
            tabela.appendChild(linha);
        });
    }

    function atualizarContadores() {
        let faturamentoTotal = 0;
        let itensTotais = 0;

        vendas.forEach(function(venda) {
            faturamentoTotal = faturamentoTotal + venda.totalVenda;
            itensTotais = itensTotais + venda.quantidade;
        });

        faturamentoEl.textContent = `Faturamento: R$ ${faturamentoTotal.toFixed(2)}`;
        itensEl.textContent = `Itens vendidos: ${itensTotais}`;
        vendasEl.textContent = `Vendas realizadas: ${vendas.length}`;
    }
</script>
</body>
</html>
