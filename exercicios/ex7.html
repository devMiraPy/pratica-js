<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Exercício 07 — Validação de formulário</title>
<style>
body{font-family:Arial, sans-serif;background:#f4f4f4;padding:40px;color:#333}
main{background:#fff;max-width:500px;margin:auto;padding:30px 35px;border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
h1{font-size:20px}
input{padding:9px;margin:6px 0;width:100%;box-sizing:border-box;border:1px solid #ccc;border-radius:6px;font-size:14px}
button{padding:10px 18px;border:none;border-radius:6px;background:#2d6cdf;color:#fff;cursor:pointer;margin-top:10px}
button:hover{background:#1f4fb0}
#mensagem{margin-top:15px;font-weight:bold}
.erro{color:#c0392b}
.sucesso{color:#1e8449}
</style>
</head>
<body>
<main>
    <h1>Cadastro de Usuário</h1>

    <input type="text" id="nome" placeholder="Nome">
    <input type="email" id="email" placeholder="E-mail">
    <input type="password" id="senha" placeholder="Senha">

    <button id="btnCadastrar">Cadastrar</button>

    <p id="mensagem"></p>
</main>

<script>
    const nome = document.querySelector("#nome");
    const email = document.querySelector("#email");
    const senha = document.querySelector("#senha");
    const botao = document.querySelector("#btnCadastrar");
    const mensagem = document.querySelector("#mensagem");

    botao.addEventListener("click", function() {
        if (nome.value === "" || email.value === "" || senha.value === "") {
            mensagem.textContent = "Preencha todos os campos.";
            mensagem.className = "erro";
        } else {
            mensagem.textContent = "Cadastro realizado com sucesso!";
            mensagem.className = "sucesso";
        }
    });
</script>
</body>
</html>
