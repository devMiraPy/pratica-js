<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Exercício 10 — Calculadora de desconto</title>
<style>
body{font-family:Arial, sans-serif;background:#f4f4f4;padding:40px;color:#333}
main{background:#fff;max-width:500px;margin:auto;padding:30px 35px;border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
h1{font-size:20px}
input{padding:9px;margin:6px 0;width:100%;box-sizing:border-box;border:1px solid #ccc;border-radius:6px;font-size:14px}
button{padding:10px 18px;border:none;border-radius:6px;background:#2d6cdf;color:#fff;cursor:pointer;margin-top:10px}
button:hover{background:#1f4fb0}
#resultado{margin-top:15px;padding:14px;border-radius:8px;background:#f0f6ff;font-size:15px;line-height:1.6}
#resultado strong{color:#1e8449}
</style>
</head>
<body>
<main>
    <h1>Calculadora de Desconto</h1>

    <input type="text" id="produto" placeholder="Produto">
    <input type="number" id="preco" placeholder="Preço (R$)">
    <input type="number" id="desconto" placeholder="Desconto (%)">

    <button id="btnCalcular">Calcular</button>

    <div id="resultado"></div>
</main>

<script>
    const produto = document.querySelector("#produto");
    const preco = document.querySelector("#preco");
    const desconto = document.querySelector("#desconto");
    const botao = document.querySelector("#btnCalcular");
    const resultado = document.querySelector("#resultado");

    botao.addEventListener("click", function() {
        const valorPreco = Number(preco.value);
        const percentualDesconto = Number(desconto.value);

        const valorDesconto = valorPreco * (percentualDesconto / 100);
        const precoFinal = valorPreco - valorDesconto;

        resultado.innerHTML = `
            <strong>${produto.value || "Produto"}</strong><br>
            Preço: R$ ${valorPreco.toFixed(2)}<br>
            Desconto (${percentualDesconto}%): R$ ${valorDesconto.toFixed(2)}<br>
            <strong>Total: R$ ${precoFinal.toFixed(2)}</strong>
        `;
    });
</script>
</body>
</html>
