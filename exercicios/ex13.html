<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Exercício 13 — Cadastro de alunos</title>
<style>
body{font-family:Arial, sans-serif;background:#f4f4f4;padding:40px;color:#333}
main{background:#fff;max-width:600px;margin:auto;padding:30px 35px;border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
h1{font-size:20px}
h2{font-size:16px;color:#555;margin-top:24px}
input{padding:9px;margin:6px 0;width:100%;box-sizing:border-box;border:1px solid #ccc;border-radius:6px;font-size:14px}
button{padding:10px 18px;border:none;border-radius:6px;background:#2d6cdf;color:#fff;cursor:pointer;margin-top:10px}
button:hover{background:#1f4fb0}
table{width:100%;border-collapse:collapse;margin-top:15px;font-size:14px}
th,td{border:1px solid #ddd;padding:8px;text-align:left}
th{background:#f0f0f0}
td button{padding:5px 10px;border:none;border-radius:6px;background:#c0392b;color:#fff;cursor:pointer;font-size:12px}
td button:hover{background:#96281b}
</style>
</head>
<body>
<main>
    <h1>Cadastro de Alunos</h1>

    <input type="text" id="nome" placeholder="Nome">
    <input type="number" id="idade" placeholder="Idade">
    <input type="text" id="curso" placeholder="Curso">

    <button id="btnCadastrar">Cadastrar</button>

    <h2>Alunos cadastrados</h2>
    <table>
        <thead>
            <tr>
                <th>Nome</th>
                <th>Idade</th>
                <th>Curso</th>
                <th>Ação</th>
            </tr>
        </thead>
        <tbody id="tabelaAlunos"></tbody>
    </table>
</main>

<script>
    const nome = document.querySelector("#nome");
    const idade = document.querySelector("#idade");
    const curso = document.querySelector("#curso");
    const botao = document.querySelector("#btnCadastrar");
    const tabela = document.querySelector("#tabelaAlunos");

    botao.addEventListener("click", function() {
        if (nome.value === "" || idade.value === "" || curso.value === "") {
            return;
        }

        const linha = document.createElement("tr");

        linha.innerHTML = `
            <td>${nome.value}</td>
            <td>${idade.value}</td>
            <td>${curso.value}</td>
            <td></td>
        `;

        const botaoExcluir = document.createElement("button");
        botaoExcluir.textContent = "Excluir";
        botaoExcluir.addEventListener("click", function() {
            linha.remove();
        });

        linha.querySelector("td:last-child").appendChild(botaoExcluir);

        tabela.appendChild(linha);

        nome.value = "";
        idade.value = "";
        curso.value = "";
    });
</script>
</body>
</html>
