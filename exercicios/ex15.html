<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Exercício 15 — Mini sistema acadêmico</title>
<style>
body{font-family:Arial, sans-serif;background:#f4f4f4;padding:40px;color:#333}
main{background:#fff;max-width:750px;margin:auto;padding:30px 35px;border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
h1{font-size:20px}
h2{font-size:16px;color:#555;margin-top:24px}
.linha{display:flex;gap:10px;flex-wrap:wrap}
.linha input{flex:1;min-width:120px}
input{padding:9px;margin:6px 0;box-sizing:border-box;border:1px solid #ccc;border-radius:6px;font-size:14px}
button{padding:10px 18px;border:none;border-radius:6px;background:#2d6cdf;color:#fff;cursor:pointer;margin-top:10px}
button:hover{background:#1f4fb0}
table{width:100%;border-collapse:collapse;margin-top:15px;font-size:13px}
th,td{border:1px solid #ddd;padding:7px;text-align:left}
th{background:#f0f0f0}
td button{padding:5px 10px;border:none;border-radius:6px;background:#c0392b;color:#fff;cursor:pointer;font-size:12px}
td button:hover{background:#96281b}
.Aprovado{color:#1e8449;font-weight:bold}
.Recuperação{color:#d68910;font-weight:bold}
.Reprovado{color:#c0392b;font-weight:bold}
.contadores{display:flex;gap:15px;margin-top:18px;flex-wrap:wrap;font-size:13px}
.contadores span{background:#f0f6ff;padding:10px 14px;border-radius:8px;font-weight:bold}
</style>
</head>
<body>
<main>
    <h1>Mini Sistema Acadêmico</h1>

    <h2>Cadastro de aluno</h2>
    <div class="linha">
        <input type="text" id="nome" placeholder="Nome">
        <input type="text" id="ra" placeholder="RA">
        <input type="text" id="curso" placeholder="Curso">
    </div>
    <div class="linha">
        <input type="number" id="nota1" placeholder="Nota 1" step="0.1">
        <input type="number" id="nota2" placeholder="Nota 2" step="0.1">
    </div>

    <button id="btnCadastrar">Cadastrar</button>

    <h2>Pesquisar aluno</h2>
    <input type="text" id="pesquisa" placeholder="Pesquisar por nome ou RA...">

    <h2>Alunos cadastrados</h2>
    <table>
        <thead>
            <tr>
                <th>Nome</th>
                <th>RA</th>
                <th>Curso</th>
                <th>Média</th>
                <th>Situação</th>
                <th>Ação</th>
            </tr>
        </thead>
        <tbody id="tabelaAlunos"></tbody>
    </table>

    <div class="contadores">
        <span id="totalAlunos">Total de alunos: 0</span>
        <span id="totalAprovados">Aprovados: 0</span>
        <span id="totalReprovados">Reprovados: 0</span>
    </div>
</main>

<script>
    const nomeInput = document.querySelector("#nome");
    const raInput = document.querySelector("#ra");
    const cursoInput = document.querySelector("#curso");
    const nota1Input = document.querySelector("#nota1");
    const nota2Input = document.querySelector("#nota2");
    const botao = document.querySelector("#btnCadastrar");
    const tabela = document.querySelector("#tabelaAlunos");
    const pesquisa = document.querySelector("#pesquisa");

    const totalAlunosEl = document.querySelector("#totalAlunos");
    const totalAprovadosEl = document.querySelector("#totalAprovados");
    const totalReprovadosEl = document.querySelector("#totalReprovados");

    let alunos = [];

    botao.addEventListener("click", function() {
        const nome = nomeInput.value;
        const ra = raInput.value;
        const curso = cursoInput.value;
        const nota1 = Number(nota1Input.value);
        const nota2 = Number(nota2Input.value);

        if (nome === "" || ra === "" || curso === "") {
            return;
        }

        const media = (nota1 + nota2) / 2;

        let situacao = "";

        if (media >= 6) {
            situacao = "Aprovado";
        } else if (media >= 4) {
            situacao = "Recuperação";
        } else {
            situacao = "Reprovado";
        }

        alunos.push({ nome, ra, curso, media, situacao });

        nomeInput.value = "";
        raInput.value = "";
        cursoInput.value = "";
        nota1Input.value = "";
        nota2Input.value = "";

        renderizarTabela(alunos);
        atualizarContadores();
    });

    pesquisa.addEventListener("input", function() {
        const termo = pesquisa.value.toLowerCase();
        const filtrados = alunos.filter(function(aluno) {
            return aluno.nome.toLowerCase().includes(termo) ||
                   aluno.ra.toLowerCase().includes(termo);
        });
        renderizarTabela(filtrados);
    });

    function renderizarTabela(lista) {
        tabela.innerHTML = "";

        lista.forEach(function(aluno) {
            const linha = document.createElement("tr");

            linha.innerHTML = `
                <td>${aluno.nome}</td>
                <td>${aluno.ra}</td>
                <td>${aluno.curso}</td>
                <td>${aluno.media.toFixed(1)}</td>
                <td class="${aluno.situacao}">${aluno.situacao}</td>
                <td></td>
            `;

            const botaoExcluir = document.createElement("button");
            botaoExcluir.textContent = "Excluir";
            botaoExcluir.addEventListener("click", function() {
                alunos = alunos.filter(function(a) { return a.ra !== aluno.ra; });
                renderizarTabela(alunos);
                atualizarContadores();
            });

            linha.querySelector("td:last-child").appendChild(botaoExcluir);

            tabela.appendChild(linha);
        });
    }

    function atualizarContadores() {
        const aprovados = alunos.filter(function(a) { return a.situacao === "Aprovado"; }).length;
        const reprovados = alunos.filter(function(a) { return a.situacao === "Reprovado"; }).length;

        totalAlunosEl.textContent = `Total de alunos: ${alunos.length}`;
        totalAprovadosEl.textContent = `Aprovados: ${aprovados}`;
        totalReprovadosEl.textContent = `Reprovados: ${reprovados}`;
    }
</script>
</body>
</html>
