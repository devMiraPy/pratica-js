<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Exercício 02 — Alterando o título</title>
<style>
body{font-family:Arial, sans-serif;background:#f4f4f4;padding:40px;color:#333;text-align:center}
main{background:#fff;max-width:500px;margin:auto;padding:30px 35px;border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
button{padding:10px 18px;border:none;border-radius:6px;background:#2d6cdf;color:#fff;cursor:pointer;margin-top:10px}
button:hover{background:#1f4fb0}
</style>
</head>
<body>
<main>
    <h1 id="titulo">Curso de Desenvolvimento de Sistemas</h1>
    <button id="btnAlterar">Alterar título</button>
</main>

<script>
    const titulo = document.querySelector("#titulo");
    const botao = document.querySelector("#btnAlterar");

    botao.addEventListener("click", function() {
        titulo.textContent = "Desenvolvimento de Sistemas — SENAI";
        titulo.style.color = "#2d6cdf";
    });
</script>
</body>
</html>
