<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Exercício 09 — Lista de tarefas</title>
<style>
body{font-family:Arial, sans-serif;background:#f4f4f4;padding:40px;color:#333}
main{background:#fff;max-width:500px;margin:auto;padding:30px 35px;border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
h1{font-size:20px}
h2{font-size:16px;color:#555}
.linha{display:flex;gap:10px}
input{padding:9px;margin:6px 0;flex:1;box-sizing:border-box;border:1px solid #ccc;border-radius:6px;font-size:14px}
button{padding:10px 18px;border:none;border-radius:6px;background:#2d6cdf;color:#fff;cursor:pointer;margin-top:6px}
button:hover{background:#1f4fb0}
ul{list-style:none;padding:0;margin-top:15px}
li{padding:8px 0;border-bottom:1px solid #eee}
</style>
</head>
<body>
<main>
    <h1>Minha Lista de Tarefas</h1>

    <div class="linha">
        <input type="text" id="tarefa" placeholder="Digite uma tarefa">
        <button id="btnAdicionar">Adicionar</button>
    </div>

    <h2>Minhas tarefas</h2>
    <ul id="listaTarefas"></ul>
</main>

<script>
    const tarefaInput = document.querySelector("#tarefa");
    const botao = document.querySelector("#btnAdicionar");
    const lista = document.querySelector("#listaTarefas");

    botao.addEventListener("click", function() {
        const texto = tarefaInput.value;

        if (texto === "") {
            return;
        }

        const item = document.createElement("li");
        item.textContent = `☐ ${texto}`;

        lista.appendChild(item);

        tarefaInput.value = "";
    });
</script>
</body>
</html>
