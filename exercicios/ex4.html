<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Exercício 04 — Status de atendimento</title>
<style>
body{font-family:Arial, sans-serif;background:#f4f4f4;padding:40px;color:#333;text-align:center}
main{background:#fff;max-width:500px;margin:auto;padding:30px 35px;border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
button{padding:10px 18px;border:none;border-radius:6px;background:#2d6cdf;color:#fff;cursor:pointer;margin-top:10px}
button:hover{background:#1f4fb0}
#status{font-size:18px;font-weight:bold;color:#c0392b}
#status.aberto{color:#1e8449}
</style>
</head>
<body>
<main>
    <h1>Atendimento</h1>
    <p id="status">Status: Atendimento fechado</p>
    <button id="btnAbrir">Abrir atendimento</button>
</main>

<script>
    const status = document.querySelector("#status");
    const botao = document.querySelector("#btnAbrir");

    botao.addEventListener("click", function() {
        status.textContent = "Status: Atendimento aberto";
        status.classList.add("aberto");
    });
</script>
</body>
</html>
