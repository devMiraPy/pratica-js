<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Exercício 12 — Carrinho de compras</title>
<style>
body{font-family:Arial, sans-serif;background:#f4f4f4;padding:40px;color:#333}
main{background:#fff;max-width:550px;margin:auto;padding:30px 35px;border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
h1{font-size:20px}
h2{font-size:16px;color:#555;margin-top:24px}
.produto{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #eee}
.produto button{padding:6px 12px;border:none;border-radius:6px;background:#2d6cdf;color:#fff;cursor:pointer;font-size:13px}
.produto button:hover{background:#1f4fb0}
ul{list-style:none;padding:0;margin-top:10px}
li{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #eee}
li button{padding:5px 10px;border:none;border-radius:6px;background:#c0392b;color:#fff;cursor:pointer;font-size:12px}
li button:hover{background:#96281b}
#resumo{margin-top:15px;font-size:16px;font-weight:bold}
</style>
</head>
<body>
<main>
    <h1>Loja Virtual</h1>

    <h2>Produtos disponíveis</h2>
    <div id="listaProdutos"></div>

    <h2>Carrinho</h2>
    <ul id="carrinho"></ul>

    <p id="resumo">Itens no carrinho: 0 — Total: R$ 0.00</p>
</main>

<script>
    const produtos = [
        { nome: "Notebook", preco: 3500 },
        { nome: "Mouse", preco: 80 },
        { nome: "Teclado", preco: 150 }
    ];

    const listaProdutos = document.querySelector("#listaProdutos");
    const carrinhoEl = document.querySelector("#carrinho");
    const resumo = document.querySelector("#resumo");

    let carrinho = [];

    produtos.forEach(function(produto) {
        const linha = document.createElement("div");
        linha.className = "produto";
        linha.innerHTML = `
            <span>${produto.nome} — R$ ${produto.preco.toFixed(2)}</span>
        `;

        const botaoAdicionar = document.createElement("button");
        botaoAdicionar.textContent = "Adicionar";
        botaoAdicionar.addEventListener("click", function() {
            carrinho.push(produto);
            atualizarCarrinho();
        });

        linha.appendChild(botaoAdicionar);
        listaProdutos.appendChild(linha);
    });

    function atualizarCarrinho() {
        carrinhoEl.innerHTML = "";

        let total = 0;

        carrinho.forEach(function(item, indice) {
            total = total + item.preco;

            const li = document.createElement("li");
            li.innerHTML = `<span>${item.nome} — R$ ${item.preco.toFixed(2)}</span>`;

            const botaoRemover = document.createElement("button");
            botaoRemover.textContent = "Remover";
            botaoRemover.addEventListener("click", function() {
                carrinho.splice(indice, 1);
                atualizarCarrinho();
            });

            li.appendChild(botaoRemover);
            carrinhoEl.appendChild(li);
        });

        resumo.textContent = `Itens no carrinho: ${carrinho.length} — Total: R$ ${total.toFixed(2)}`;
    }
</script>
</body>
</html>
