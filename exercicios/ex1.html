<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Exercício 01 — Saudação</title>
<style>
body{font-family:Arial, sans-serif;background:#f4f4f4;padding:40px;color:#333}
main{background:#fff;max-width:500px;margin:auto;padding:30px 35px;border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
h1{font-size:20px}
input{padding:9px;margin:6px 0;width:100%;box-sizing:border-box;border:1px solid #ccc;border-radius:6px;font-size:14px}
button{padding:10px 18px;border:none;border-radius:6px;background:#2d6cdf;color:#fff;cursor:pointer;margin-top:10px}
button:hover{background:#1f4fb0}
#resultado{margin-top:15px;font-size:16px;font-weight:bold;color:#1e8449}
</style>
</head>
<body>
<main>
    <h1>Página de Recepção</h1>

    <input type="text" id="nome" placeholder="Digite seu nome">
    <button id="btnEnviar">Enviar</button>

    <p id="resultado"></p>
</main>

<script>
    const nome = document.querySelector("#nome");
    const botao = document.querySelector("#btnEnviar");
    const resultado = document.querySelector("#resultado");

    botao.addEventListener("click", function() {
        const nomeDigitado = nome.value;
        resultado.textContent = `Olá, ${nomeDigitado}! Seja bem-vindo!`;
    });
</script>
</body>
</html>
